services:
  - type: web
    name: django-dev-app
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn dev.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DEBUG
        value: "False"
